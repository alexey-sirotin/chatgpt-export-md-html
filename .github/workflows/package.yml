name: Package browser extensions

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build Chromium and Firefox packages
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash scripts/package.sh "$GITHUB_REF_NAME"
          else
            bash scripts/package.sh
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser-packages
          path: dist/*.zip
          if-no-files-found: error

      - name: Create or update draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(dist/*.zip)

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release $tag is already published; refusing to modify immutable release assets." >&2
              exit 1
            fi
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --draft \
              --verify-tag \
              --title "$tag" \
              --generate-notes
          fi
