name: Package browser extensions

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Vendor KaTeX runtime into branch
        if: github.event_name == 'pull_request' && github.head_ref == 'add-katex-rendering'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          git add -f vendor/katex.mjs vendor/KATEX-LICENSE.txt
          if git diff --cached --quiet; then
            echo "KaTeX runtime is already vendored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: vendor KaTeX runtime"
          git push origin "HEAD:$HEAD_REF"

      - name: Run unit tests
        run: npm test

      - name: Build Chromium and Firefox packages
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash scripts/package.sh "$GITHUB_REF_NAME"
          else
            bash scripts/package.sh
          fi

      - name: Smoke-test browser packages
        run: npm run test:package

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser-packages
          path: dist/*.zip
          if-no-files-found: error

      - name: Create or update draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(dist/*.zip)

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release $tag is already published; refusing to modify immutable release assets." >&2
              exit 1
            fi
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --draft \
              --verify-tag \
              --title "$tag" \
              --generate-notes
          fi
