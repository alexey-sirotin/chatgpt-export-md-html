name: Finalize Mermaid vendoring

on:
  push:
    branches:
      - add-mermaid-rendering

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: add-mermaid-rendering

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate and commit vendored Mermaid runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund

          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['postinstall'] = (
              'node scripts/prepare-katex.mjs && node scripts/prepare-mermaid.mjs'
          )
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

          rm -f scripts/apply-mermaid-feature.mjs

          git config user.name "Morgana Hartwell"
          git config user.email "morgana.hartwell@gmail.com"
          git add background.js package.json scripts/package-smoke.py scripts/apply-mermaid-feature.mjs vendor/mermaid.min.js vendor/MERMAID-LICENSE.txt
          git commit -m "chore: finalize Mermaid rendering integration"
          git push origin HEAD:add-mermaid-rendering
